server:
  port: 9090

spring:
  application:
    name: authorization-server

  datasource:
    url: jdbc:postgresql://localhost:5432/authorization_db
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.oauth2.server.authorization: DEBUG